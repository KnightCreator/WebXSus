<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cozy Corner</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fdf6f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    .header-box {
      width: 300px;
      height: 300px;
      background-color: #ffe8d6;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: glitch 1s infinite;
      cursor: pointer;
      transition: left 0.2s ease, top 0.2s ease;
    }

    .header-box h1 {
      font-size: 24px;
      color: #5d473a;
      text-align: center;
      padding: 20px;
      transition: transform 0.3s ease;
    }

    @keyframes glitch {
      0% { filter: none; }
      20% { filter: hue-rotate(20deg); }
      40% { filter: contrast(1.1); }
      60% { filter: hue-rotate(-20deg); }
      80% { filter: blur(0.5px); }
      100% { filter: none; }
    }

    .scoreboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #fff3e0;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      font-weight: bold;
      color: #333;
    }

    .flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s;
    }

    .sus-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: red;
      color: white;
      padding: 20px 40px;
      font-size: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px red;
      z-index: 20;
      display: none;
    }
  </style>
</head>
<body>
  <div class="scoreboard">Score: <span id="score">0</span></div>

  <div class="header-box" id="prank-box" onclick="handleClick()">
    <h1 id="prank-text">Welcome, Friend :)</h1>
  </div>

  <div class="flash" id="screen-flash"></div>
  <div class="sus-alert" id="sus-alert">SUS ALERT</div>

  <audio id="sus-sound" src="https://cdn.glitch.global/7b489c7f-6c57-4d77-b7d3-394c51a8b6c4/sus.mp3?v=1686501761234" preload="auto"></audio>

  <script>
    const texts = [
      "Welcome, Friend :)",
      "U smell like onion 🧅",
      "DIAMLAH BODO",
      "You're being watched 👀",
      "hi loser 😎",
      "Where’s your CSS now?",
      "LOL imagine falling for this",
      "Sussy behavior detected",
      "Your IP: 127.0.0.1",
      "Click faster 😐"
    ];

    const box = document.getElementById('prank-box');
    const h1 = document.getElementById('prank-text');
    const scoreDisplay = document.getElementById('score');
    const flash = document.getElementById('screen-flash');
    const susAlert = document.getElementById('sus-alert');
    const sound = document.getElementById('sus-sound');

    let score = 0;

    function changeText() {
      const randomText = texts[Math.floor(Math.random() * texts.length)];
      const randomAngle = Math.floor(Math.random() * 20) - 10;
      h1.innerText = randomText;
      h1.style.transform = `rotate(${randomAngle}deg)`;
    }

    function flashScreen() {
      flash.style.background = Math.random() < 0.5 ? 'white' : 'red';
      flash.style.opacity = 1;
      setTimeout(() => flash.style.opacity = 0, 150);
    }

    function showSusAlert() {
      susAlert.style.display = 'block';
      setTimeout(() => susAlert.style.display = 'none', 1000);
    }

    function moveBox() {
      const maxX = window.innerWidth - 300;
      const maxY = window.innerHeight - 300;
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);
      box.style.left = `${randomX}px`;
      box.style.top = `${randomY}px`;
    }

    function handleClick() {
      score++;
      scoreDisplay.innerText = score;
      moveBox();
      changeText();

      if (Math.random() < 0.5) {
        flashScreen();
      }
      if (Math.random() < 0.3) {
        showSusAlert();
      }
      if (Math.random() < 0.7) {
        sound.play();
      }
    }

    setInterval(changeText, 3000);
  </script>
</body>
</html>
