<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cozy Corner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #fdf6f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    .header-box {
      width: 300px;
      height: 300px;
      background-color: #ffe8d6;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      animation: glitch 1s infinite;
      cursor: pointer;
    }

    .header-box h1 {
      font-size: 24px;
      color: #5d473a;
      text-align: center;
      padding: 20px;
      transition: transform 0.3s ease;
    }

    @keyframes glitch {
      0% { filter: none; }
      20% { filter: hue-rotate(20deg); }
      40% { filter: contrast(1.1); }
      60% { filter: hue-rotate(-20deg); }
      80% { filter: blur(0.5px); }
      100% { filter: none; }
    }

    .scoreboard {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #fff3e0;
      padding: 10px 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="scoreboard">Score: <span id="score">0</span></div>

  <div class="header-box" id="prank-box" onclick="handleClick()">
    <h1 id="prank-text">Welcome, Friend :)</h1>
  </div>

  <script>
    const texts = [
      "Welcome, Friend :)",
      "U smell like onion 🧅",
      "Why u clicking so hard?",
      "DIAMLAH BODO",
      "You're being watched 👀",
      "hi loser 😎",
      "Where’s your CSS now?",
      "LOL imagine falling for this"
    ];

    const box = document.getElementById('prank-box');
    const h1 = document.getElementById('prank-text');
    const scoreDisplay = document.getElementById('score');
    let score = 0;

    function changeText() {
      const randomText = texts[Math.floor(Math.random() * texts.length)];
      const randomAngle = Math.floor(Math.random() * 20) - 10;
      h1.innerText = randomText;
      h1.style.transform = `rotate(${randomAngle}deg)`;
    }

    function moveBox() {
      const maxX = window.innerWidth - 300;
      const maxY = window.innerHeight - 300;
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);
      box.style.left = `${randomX}px`;
      box.style.top = `${randomY}px`;
    }

    function handleClick() {
      score++;
      scoreDisplay.innerText = score;
      moveBox();
      changeText();
    }

    // Text changes automatically every 3 seconds too
    setInterval(changeText, 3000);
  </script>
</body>
</html>
